name: CI

# Self-hosted runner `deadzone` (box, Node 22 + corepack w PATH) - bez minut GitHub Actions.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: [self-hosted, deadzone]
    timeout-minutes: 20
    env:
      # Testy wydajności sima (packages/sim *.perf / *-perf) tylko na push do main i workflow_dispatch.
      SKIP_PERF: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Node i pnpm (z runnera)
        run: node -v && pnpm -v

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @deadzone/map map build tools/map/blueprints/demo-house.json tools/map/blueprints/test-town.json --check
      - run: pnpm build
