name: CI

# Self-hosted runner `deadzone` (box, Node 22 + corepack w PATH) - bez minut GitHub Actions.
# Decyzja Pawła (20.11.2026): testy uruchamiamy lokalnie (`pnpm lint`, `pnpm typecheck`,
# `pnpm test`, `pnpm build`) przed każdym PR-em, bez automatycznego CI na push i PR. Box `deadzone`
# zostaje nietknięty; ten workflow da się odpalić tylko ręcznie (gdy runner jest podpięty do repo).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: [self-hosted, deadzone]
    # 20 min nie wystarcza: testy map (obrysy budynków na 3 mapach) na zajętym boxie trwają >20 min i job był anulowany.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # pnpm przez corepack Node'a runnera, w wersji z packageManager (package.json); nie zależy od
      # shimów w PATH runnera ani systemowego /usr/bin/pnpm (stary corepack z Node 20 nie odpala pnpm 12).
      - name: Node i pnpm (corepack, wersja z packageManager)
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/corepack-bin"
          mkdir -p "$bin"
          corepack enable --install-directory "$bin" pnpm
          echo "$bin" >> "$GITHUB_PATH"
          export PATH="$bin:$PATH"
          corepack install
          want=$(node -p "require('./package.json').packageManager.split('@')[1]")
          node -v && pnpm -v
          [ "$(pnpm -v)" = "$want" ] || { echo "pnpm $(pnpm -v) != $want"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Testy wydajności sima (packages/sim *.perf / *-perf) nie w równoległym `pnpm test`
      # (obciążenie współdzielonego boxa zawyża czasy), tylko osobno, na push do main i workflow_dispatch.
      # Najwyżej 2 pakiety naraz: na współdzielonym boxie pełna równoległość dawała losowe timeouty 5 s.
      # maxWorkers=2: bez limitu każdy pakiet odpalał ~7 forków vitest (8 rdzeni), a 2 pakiety naraz to OOM (exit 137) na 16 GB współdzielonego boxa.
      - run: pnpm turbo run test --concurrency=2 -- --maxWorkers=2
        env:
          SKIP_PERF: '1'
      - name: Testy wydajności sima (main / ręcznie)
        if: github.event_name != 'pull_request'
        run: pnpm --filter @deadzone/sim exec vitest run perf
      - run: pnpm --filter @deadzone/map map build tools/map/blueprints/demo-house.json tools/map/blueprints/test-town.json --check
      - run: pnpm build
